name: Auto deploy agent tests
on:
  pull_request:
    paths: ['deploy/auto/**', '.github/workflows/autodeploy-agent-tests.yml']
  push:
    branches: [develop]
    paths: ['deploy/auto/**', '.github/workflows/autodeploy-agent-tests.yml']
permissions:
  contents: read
jobs:
  release-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s deploy/auto -p test_agent.py -v
