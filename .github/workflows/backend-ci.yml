name: Backend CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore AIPMS.sln
      - run: dotnet build AIPMS.sln --configuration Release --no-restore
      - run: dotnet test AIPMS.sln --configuration Release --no-build
