name: aipms

services:
  api:
    image: aipms-api:${AIPMS_IMAGE_TAG:-local}
    container_name: aipms-api
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_HTTP_PORTS: "8080"
      COMMIT_SHA: ${COMMIT_SHA:-}
      FileStorage__RootPath: /var/lib/aipms/files
      OfficePreview__GotenbergUrl: http://aipms-gotenberg:3000
    ports:
      - "127.0.0.1:5088:8080"
    volumes:
      - type: bind
        source: ${AIPMS_CONFIG_FILE:?Set AIPMS_CONFIG_FILE to the private WSL JSON file}
        target: /app/appsettings.Staging.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AIPMS_FILES_PATH:?Set AIPMS_FILES_PATH to the existing shared upload directory}
        target: /var/lib/aipms/files
        bind:
          create_host_path: false
      - keys:/var/lib/aipms/keys
      - logs:/var/log/aipms
    networks:
      tunnel:
        aliases: [aipms-api]
      database: {}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8080/api/v1/system]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: aipms-gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-routes
      - --libreoffice-auto-start=false
      - --libreoffice-idle-shutdown-timeout=5m
      - --libreoffice-max-queue-size=10
      - --libreoffice-deny-private-ips
      - --libreoffice-deny-public-ips
      - --api-timeout=45s
      - --log-level=warn
    mem_limit: 768m
    networks:
      database:
        aliases: [aipms-gotenberg]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:3000/health]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  keys: {}
  logs: {}

networks:
  tunnel:
    external: true
    name: go-exe_goexe-net
  database:
    external: true
    name: aipms-data
